[project]
name = "pd2af"
version = "0.0.2"
description = "Transform process-description maps (SBGN-PD, CellDesigner) into SBGN-AF activity-flow maps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aspcompose>=0.1.0",
  "clorm>=1.6.3",
  "momapy-kb[clingo]>=0.4.1",
  "pydot>=4.0.1",
]

[project.scripts]
pd2af = "pd2af.cli:main"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "mkdocs-material>=9.7.7",
  "mkdocs-gen-files>=0.6.1",
  "mkdocstrings-python>=2.0.7",
  "griffe-fieldz>=0.5.0",
  "griffe-inherited-docstrings>=1.1.3",
  "mkdocs-pygments>=0.1.0",
  "momapy",
]
test = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.uv.sources]
momapy = { path = "../momapy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
