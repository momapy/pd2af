[project]
name = "pd2af"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aspcompose>=0.1.0",
  "clorm>=1.6.1",
  "momapy>=0.11.1",
  "momapy-kb[clingo]>=0.3.0",
  "pydot>=4.0.1",
]

[project.scripts]
pd2af = "pd2af.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mkdocs-material>=9.6.16",
    "mkdocstrings-python>=1.16.12",
    "griffe-fieldz>=0.1.2",
    "griffe-inherited-docstrings>=1.1.1",
    "mkdocs-pygments>=0.0.2",
]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
