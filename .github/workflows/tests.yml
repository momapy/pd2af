name: Tests

on:
  workflow_call:
  push:
    branches:
      - testing
      - main
  pull_request:

jobs:
  lint:
    name: Lint (ruff D + ANN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
        shell: bash
      - name: Install tox
        run: |
          pip install tox tox-uv
        shell: bash
      - name: Run ruff lint and format checks
        run: |
          tox -e lint
        shell: bash

  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install graphviz (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
        shell: bash
      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
        shell: bash
      - name: Install graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress
        shell: bash
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache tox environments
        uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Run tests with tox
        run: uv run --python ${{ matrix.python-version }} --group dev tox -e py
        shell: bash
        env:
          CI: true
