name: Tests

on:
  workflow_call:
  push:
    branches:
      - testing
      - main
  pull_request:

jobs:
  lint:
    name: Lint (ruff D + ANN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
        shell: bash
      - name: Install tox
        run: |
          pip install tox tox-uv
        shell: bash
      - name: Run ruff lint and format checks
        run: |
          tox -e lint
        shell: bash

  test:
    name: Test on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          allow-prereleases: true
      - name: Install graphviz (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
        shell: bash
      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
        shell: bash
      - name: Install graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress
        shell: bash
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
        shell: bash
      - name: Install tox
        run: |
          pip install tox tox-uv
        shell: bash
      - name: Run tests with tox (all Python versions)
        run: |
          tox -e py312,py313,py314
        shell: bash
