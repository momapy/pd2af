[tox]
envlist = py{312,313,314}

[testenv]
description = Run tests with pytest
dependency_groups = test
commands =
    pytest {posargs:tests/}

[testenv:lint]
description = Check docstrings (ruff D) and type annotations (ruff ANN) plus formatting
skip_install = true
deps = ruff>=0.14.10,<0.15
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:coverage]
description = Run tests with coverage report
dependency_groups = test
commands =
    pytest --cov=pd2af --cov-report=term --cov-report=html {posargs:tests/}
